services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=40
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ptgi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-goal_intl}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ptgi} -d ${POSTGRES_DB:-goal_intl}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 300M

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-ptgi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-goal_intl}
      DATABASE_URL_DIRECT: postgres://${POSTGRES_USER:-ptgi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-goal_intl}
      WEB_ORIGIN: ${PUBLIC_ORIGIN}
      AUTH_DISABLED: "false"
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
    deploy:
      resources:
        limits:
          memory: 450M

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_ORIGIN}
    restart: unless-stopped
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 450M

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  pgdata:
